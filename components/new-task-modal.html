<div class="modal-overlay" id="new-task-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="new-task-title">

    <div class="modal-header">
      <h2 class="modal-title" id="new-task-title">Nueva tarea</h2>
      <button class="modal-close" id="new-task-close-btn" aria-label="Cerrar" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <form id="new-task-form" class="task-form">

      <div class="field">
        <label class="field-label" for="new-task-title-input">Título</label>
        <input type="text" id="new-task-title-input" name="title" class="field-input" required maxlength="80" placeholder="Ej. Maquetar cabecera responsive">
      </div>

      <div class="field">
        <label class="field-label" for="new-task-description-input">Descripción</label>
        <textarea id="new-task-description-input" name="description" class="field-input" rows="3" maxlength="400" placeholder="Añade detalles de la tarea..."></textarea>
      </div>

      <div class="field">
        <span class="field-label">Prioridad</span>
        <div class="priority-selector" role="radiogroup" aria-label="Prioridad de la tarea">
          <button type="button" class="priority-pill priority-baja" data-priority="Baja">Baja</button>
          <button type="button" class="priority-pill priority-media priority-active" data-priority="Media">Media</button>
          <button type="button" class="priority-pill priority-alta" data-priority="Alta">Alta</button>
        </div>
        <input type="hidden" id="new-task-priority-input" name="priority" value="Media" required>
      </div>

      <div class="field">
        <label class="field-label" for="new-task-duedate-input">Fecha límite</label>
        <input type="date" id="new-task-duedate-input" name="dueDate" class="field-input" required>
      </div>

      <div class="task-form-actions">
        <button type="button" class="btn btn-ghost" id="new-task-cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Crear tarea</button>
      </div>

    </form>

  </div>
</div>
