<div class="board-tabs" aria-label="Filtro de columnas">
    <button class="board-tab board-tab-active" data-status="todo" type="button">
        <span class="board-tab-dot board-tab-dot-todo" aria-hidden="true"></span>
        Por hacer
        <span class="board-tab-count">0</span>
    </button>
    <button class="board-tab" data-status="doing" type="button">
        <span class="board-tab-dot board-tab-dot-doing" aria-hidden="true"></span>
        En proceso
        <span class="board-tab-count">0</span>
    </button>
    <button class="board-tab" data-status="done" type="button">
        <span class="board-tab-dot board-tab-dot-done" aria-hidden="true"></span>
        Finalizado
        <span class="board-tab-count">0</span>
    </button>
</div>
<section class="board" aria-label="Columnas del tablero">
    <div class="column column-active" data-status="todo">
        <div class="column-header">
            <h2 class="column-title">
                <span class="column-dot column-dot-todo" aria-hidden="true"></span>
                Por hacer
            </h2>
            <span class="column-count" id="count-todo">0</span>
        </div>
        <ul class="column-list" id="list-todo" data-status="todo">

        </ul>
    </div>
    <div class="column" data-status="doing">
        <div class="column-header">
            <h2 class="column-title">
                <span class="column-dot column-dot-doing" aria-hidden="true"></span>
                En proceso
            </h2>
            <span class="column-count" id="count-doing">0</span>
        </div>
        <ul class="column-list" id="list-doing" data-status="doing">

        </ul>
    </div>
    <div class="column" data-status="done">
        <div class="column-header">
            <h2 class="column-title">
                <span class="column-dot column-dot-done" aria-hidden="true"></span>
                Finalizado
            </h2>
            <span class="column-count" id="count-done">0</span>
        </div>
        <ul class="column-list" id="list-done" data-status="done">

        </ul>
    </div>
</section>

<!--Plantilla de las cartas-->
<template id="task-card-template">
  <li class="task-card">
    <div class="task-card-priority"></div>
    <div class="task-card-body">
      <span class="task-card-priority-badge"></span>
      <h3 class="task-card-title"></h3>
      <p class="task-card-description"></p>
      <div class="task-card-footer">
        <span class="task-card-due"></span>
      </div>
    </div>
  </li>
</template>
<!--Boton de nueva tarea-->
<button class="fab-new-task" id="new-task-btn" type="button" aria-label="Crear nueva tarea">
  <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path d="M10 4V16M4 10H16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  </svg>
  <span>Nueva tarea</span>
</button>
