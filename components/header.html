<header>
    <div class="app-header-inner">
        <div class="app-header-brand-group">
            <a href="#" class="brand">
                <span class="brand__mark" aria-hidden="true">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="1" y="1" width="7" height="18" rx="2" fill="currentColor" opacity="0.35"/>
                        <rect x="10" y="1" width="7" height="11" rx="2" fill="currentColor"/>
                    </svg>
                </span>
                <span class="brand__name">FlowBoard</span>
            </a>
            <nav class="app-nav">
                <a href="#" class="app-nav-link app-nav-link-active">Tablero</a>
                <a href="#" class="app-nav-link">Ajustes</a>
            </nav>
        </div>
        <div class="app-header-search">
            <label class="visually-hidden">Buscar tareas por títulos</label>
             <svg class="app-header__search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M11.5 11.5L14.5 14.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <input type="search" id="search-input" class="app-header-search-input" placeholder="Buscar Tareas.." autocomplete="off">
            <kbd class="app-header-search-hint" aria-hidden="true">Ctrl+k</kbd>
        </div>
        <div class="app-header-actions">
            <button class="icon-btn" aria-label="Notificaciones" type="button">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path d="M9 2.5C6.5 2.5 4.7 4.4 4.7 6.8V9.6L3.3 12.3C3.1 12.7 3.4 13.2 3.9 13.2H14.1C14.6 13.2 14.9 12.7 14.7 12.3L13.3 9.6V6.8C13.3 4.4 11.5 2.5 9 2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                    <path d="M7.3 15C7.6 15.6 8.2 16 9 16C9.8 16 10.4 15.6 10.7 15" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                </svg>
            </button>
            <span class="avatar" aria-hidden="true">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="8" cy="5.5" r="2.5" fill="currentColor"/>
                    <path d="M2.5 14C3.3 11.2 5.4 9.8 8 9.8C10.6 9.8 12.7 11.2 13.5 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
                </svg>
            </span>
            
        </div>
    </div>
</header>
