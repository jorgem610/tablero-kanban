<div class="modal-overlay" id="task-edit-overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-edit-title">

    <div class="modal-header">
      <h2 class="modal-title" id="task-edit-title">Editar tarea</h2>
      <button class="modal-close" id="task-edit-close-btn" aria-label="Cerrar" type="button">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M3 3L13 13M13 3L3 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <form id="task-edit-form" class="task-form">

      <input type="hidden" id="edit-task-id-input" name="taskId">

      <div class="field">
        <label class="field-label" for="edit-task-title-input">Título</label>
        <input type="text" id="edit-task-title-input" name="title" class="field-input" required maxlength="80">
      </div>

      <div class="field">
        <label class="field-label" for="edit-task-description-input">Descripción</label>
        <textarea id="edit-task-description-input" name="description" class="field-input" rows="3" maxlength="400"></textarea>
      </div>

      <div class="field">
        <span class="field-label">Prioridad</span>
        <div class="priority-selector" role="radiogroup" aria-label="Prioridad de la tarea">
          <button type="button" class="priority-pill priority-baja" data-priority="Baja" disabled>Baja</button>
          <button type="button" class="priority-pill priority-media" data-priority="Media" disabled>Media</button>
          <button type="button" class="priority-pill priority-alta" data-priority="Alta" disabled>Alta</button>
        </div>
        <input type="hidden" id="edit-task-priority-input" name="priority">
      </div>

      <div class="field">
        <label class="field-label" for="edit-task-duedate-input">Fecha límite</label>
        <input type="date" id="edit-task-duedate-input" name="dueDate" class="field-input" disabled>
      </div>

      <div class="task-form-actions">
        <button type="button" class="btn btn-ghost" id="edit-task-cancel-btn">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>

    </form>

  </div>
</div>
